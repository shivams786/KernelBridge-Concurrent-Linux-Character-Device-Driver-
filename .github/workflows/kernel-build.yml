name: Kernel Build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  module:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install distribution kernel headers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential linux-headers-generic
      - name: Compile with kernel warnings
        shell: bash
        run: |
          kdir=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -n 1)
          test -n "$kdir"
          make module KDIR="$kdir" W=1
      - name: Build regression tools
        run: make userspace
