name: Userspace Build and Static Checks

on:
  push:
  pull_request:

jobs:
  userspace:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build and analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential shellcheck cppcheck

      - name: Build user-space tools
        run: make userspace

      - name: Validate shell syntax
        run: bash -n scripts/*.sh tests/*.sh

      - name: Run shellcheck
        run: shellcheck scripts/*.sh tests/*.sh

      - name: Run cppcheck on user-space code
        run: cppcheck --enable=warning,style,performance,portability --error-exitcode=1 --std=c11 -Iinclude userspace

      - name: Run repository verification
        run: bash scripts/dev_check.sh

      - name: Explain kernel integration testing
        run: |
          echo "GitHub-hosted runners are not used to load this kernel module."
          echo "Run make test inside a privileged disposable Linux VM instead."
